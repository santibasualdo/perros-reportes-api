<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huellas a Casa · Coincidencias</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#e8e9e3;color:#183b56;font:15px system-ui,sans-serif} button{font:inherit;cursor:pointer} .phone{max-width:430px;height:100dvh;min-height:580px;margin:auto;background:#f5f3ed;display:flex;flex-direction:column;overflow:hidden}.status{padding:17px 24px 0;font-size:12px;font-weight:700}.header{padding:18px 22px 16px;display:flex;align-items:center;gap:15px}.back{width:42px;height:42px;border:1px solid #e5ded7;background:#fffaf3;border-radius:50%;font-size:25px;color:#183b56}.header h1{margin:0;font-size:24px}.scroll{overflow:auto;padding:0 18px 36px}.intro{margin:2px 2px 16px;color:#5a6e7c;line-height:1.45}.origin{display:flex;align-items:center;gap:12px;padding:12px;background:#ebece2;border-radius:18px;margin-bottom:24px}.origin img{width:52px;height:52px;object-fit:cover;border-radius:12px}.origin span{display:block;font-size:12px;color:#64767b}.origin strong{font-size:16px}.count{font-size:16px;font-weight:700;margin:0 2px 12px}.card{background:#fffaf3;border:1px solid #ede5dc;border-radius:20px;margin:0 0 14px;overflow:hidden}.row{display:flex;gap:14px;padding:13px}.photo{width:106px;height:112px;border-radius:14px;object-fit:cover;background:#e9e2d8}.info{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:4px}.tag,.score{display:inline-block;font-size:11px;font-weight:700;border-radius:18px;padding:5px 8px}.tag{color:#42623b;background:#e1eddf}.score{color:#42623b;background:#eef2e8}.name{font-size:17px;font-weight:700;margin:8px 0 5px}.meta{font-size:13px;color:#637582;line-height:1.7}.link{border:0;background:none;padding:9px 0 3px;color:#4f2a52;font-weight:700;font-size:13px}.photo-mode .row{display:block;padding:0}.photo-mode .photo{width:100%;height:170px;border-radius:0}.photo-mode .info{padding:14px 16px 16px}.photo-mode .link{width:100%;border-radius:14px;padding:12px;background:#4f2a52;color:white;margin-top:12px}.compare-mode .row{align-items:center}.compare-mode .photo{width:82px;height:90px}.compare-mode .score{background:#eee3e9;color:#4f2a52}.details{display:flex;gap:8px;margin:0 13px 13px}.detail{flex:1;background:#f5f3ed;border-radius:12px;padding:9px;font-size:12px;color:#62717a}.detail strong{display:block;color:#183b56;font-size:13px}.compare-mode .link{padding:0 14px 15px}.hint{font-size:12px;color:#657680;line-height:1.5;margin:16px 4px}.modal{position:fixed;inset:0;background:#19283388;display:grid;place-items:center;padding:24px}.modal[hidden]{display:none}.dialog{max-width:360px;background:#fffaf3;padding:24px;border-radius:22px}.dialog button{border:0;background:#4f2a52;color:white;border-radius:20px;padding:11px 18px}
    .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
    .proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}@media(hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker[data-position="top"]{bottom:auto;top:24px}
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" data-position="top" aria-label="Versiones del prototipo">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item" data-active aria-current="true">Compacta</button>
    <button class="proto-picker-item">Fotografía</button>
    <button class="proto-picker-item">Comparar</button>
  </nav>
  <div class="modal" hidden><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title"><h2 id="dialog-title">Reporte de ejemplo</h2><p>Acá se abriría el detalle del reporte para revisar sus datos y fotografías.</p><button type="button" id="close">Volver a coincidencias</button></div></div>
  <script>
    const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item')],modal=document.querySelector('.modal');
    const datos=[{nombre:'Perro avistado',fecha:'Hoy',distancia:'1,2 km',puntaje:86},{nombre:'Perro avistado',fecha:'Ayer',distancia:'2,8 km',puntaje:72}];
    let current=0;
    function mount(i){const modo=['compacta','photo-mode','compare-mode'][i];stage.innerHTML=`<main class="phone ${modo}"><div class="status">9:41</div><header class="header"><button class="back" aria-label="Volver a tus reportes">‹</button><h1>Coincidencias</h1></header><div class="scroll"><div class="origin"><img src="bienvenida-foto.png" alt=""><div><span>BUSCANDO COINCIDENCIAS PARA</span><strong>Simón · Perdido</strong></div></div><p class="count">2 coincidencias encontradas</p>${datos.map(d=>`<article class="card"><div class="row"><img class="photo" src="bienvenida-foto.png" alt="Fotografía de un perro"><div class="info"><div class="top"><span class="tag">Avistamiento</span><span class="score">${d.puntaje}% compatible</span></div><div class="name">${d.nombre}</div><div class="meta">⌖ &nbsp;A ${d.distancia} de tu reporte<br>◷ &nbsp;Reportado ${d.fecha.toLowerCase()}</div>${i!==2?'<button class="link review">Revisar coincidencia →</button>':''}</div></div>${i===2?`<div class="details"><div class="detail"><strong>${d.distancia}</strong>Distancia</div><div class="detail"><strong>${d.fecha}</strong>Fecha</div></div><button class="link review">Revisar coincidencia →</button>`:''}</article>`).join('')}<p class="hint">La compatibilidad se calcula con los datos de los reportes; revisá el detalle para confirmar si se trata del mismo perro.</p></div></main>`;stage.querySelectorAll('.review').forEach(b=>b.addEventListener('click',()=>{modal.hidden=false;document.getElementById('close').focus()}));stage.querySelector('.back').addEventListener('click',()=>{modal.hidden=false;document.getElementById('dialog-title').textContent='Tus reportes';document.querySelector('.dialog p').textContent='Desde acá volverías a tu lista de reportes.';document.getElementById('close').focus()})}
    function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
    function setActive(i){if(i<0||i>=items.length)return;current=i;items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
    items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));window.addEventListener('resize',moveHighlight);document.getElementById('close').addEventListener('click',()=>{modal.hidden=true;document.getElementById('dialog-title').textContent='Reporte de ejemplo';document.querySelector('.dialog p').textContent='Acá se abriría el detalle del reporte para revisar sus datos y fotografías.'});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!modal.hidden){document.getElementById('close').click();return}if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=items.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%items.length);else if(e.key==='ArrowLeft')setActive((current-1+items.length)%items.length)});
    const requested=parseInt(new URLSearchParams(location.search).get('v'),10);setActive(requested>=1&&requested<=items.length?requested-1:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
  </script>
</body>
</html>
