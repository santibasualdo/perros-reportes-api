<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huellas a Casa · Tus reportes</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7ebe4; color: #183b56; font-family: system-ui, sans-serif; }
    .phone { max-width: 430px; min-height: 100dvh; margin: auto; background: #eeece3; padding: 34px 20px 115px; }
    h1 { margin: 0 0 8px; font: 700 30px Georgia, serif; }
    .intro { color: #5a6e7c; font-size: 14px; margin: 0 0 24px; }
    .list { display: grid; gap: 12px; }
    .card { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: #fafaf7; border: 0; border-radius: 18px; padding: 12px; color: inherit; cursor: pointer; }
    .photo { width: 82px; height: 82px; object-fit: cover; border-radius: 12px; flex: none; }
    .info { flex: 1; min-width: 0; }
    .badge { display: inline-block; border-radius: 20px; background: #f6e3db; color: #b85e4d; padding: 4px 9px; font-size: 12px; font-weight: 700; }
    .sighting { background: #e1f3e4; color: #2e7d32; }
    .name { font: 700 22px Georgia, serif; margin: 6px 0; }
    .meta { font-size: 13px; color: #5a6e7c; }
    .arrow { color: #4f2a52; font-size: 25px; }
    .destacado .card { background: #fff; border: 1px solid #e1e5dd; }
    .destacado .photo { width: 96px; height: 96px; }
    .destacado .name { margin-top: 2px; }
    .grupo { font-weight: 700; font-size: 15px; margin: 10px 2px 0; }
    .agrupado .card { background: #f7f5ef; border-left: 4px solid #b85e4d; border-radius: 12px; }
    .agrupado .card[data-type="Avistamiento"] { border-left-color: #76946e; }
    .agrupado .photo { order: 2; width: 72px; height: 72px; }
    .agrupado .arrow { order: 3; }
    .detail { background: #fafaf7; border-radius: 18px; padding: 22px; }
    .back { background: none; border: 0; padding: 0; color: #4f2a52; font: inherit; font-weight: 700; cursor: pointer; }
    .nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(100%, 430px); display: flex; justify-content: space-around; background: #fafaf7; padding: 14px 8px 58px; font-size: 11px; color: #5a6e7c; }
    .nav strong { color: #4f2a52; }
    .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10,10,10,.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255,255,255,.08) inset, 0 8px 24px rgba(0,0,0,.24), 0 2px 6px rgba(0,0,0,.12); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255,255,255,.12); }
    .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(.23,1,.32,1), width 250ms cubic-bezier(.23,1,.32,1); }
    @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
    .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255,255,255,.55); font: inherit; cursor: pointer; transition: color 150ms ease-out, transform 160ms cubic-bezier(.23,1,.32,1); }
    .proto-picker-item[data-active] { color: white; }
    .proto-picker-item:focus-visible { outline: 2px solid #fff9; outline-offset: 2px; }
    .proto-picker-item:active { transform: scale(.97); }
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" aria-label="Versiones del prototipo">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item">Original</button>
    <button class="proto-picker-item">Foto amplia</button>
    <button class="proto-picker-item">Acento</button>
  </nav>
  <script>
    const reports = [
      { name: 'Simón', type: 'Perdido', date: '12 nov 2026', status: 'Activo' },
      { name: 'Luna', type: 'Avistamiento', date: '10 nov 2026', status: 'Activo' },
      { name: 'Mora', type: 'Perdido', date: '8 nov 2026', status: 'Activo' },
    ];
    const stage = document.querySelector('#stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item')];
    let current = 0;

    function card(report, index) {
      const badge = `<span class="badge ${report.type === 'Avistamiento' ? 'sighting' : ''}">${report.type}</span>`;
      const title = `<div class="name">${report.name}</div>`;
      return `<button class="card" data-report="${index}" data-type="${report.type}"><img class="photo" src="bienvenida-foto.png" alt=""><div class="info">${current === 1 ? title + badge : badge + title}<div class="meta">◷ ${report.date} · ${report.status}</div><div class="meta">Ver coincidencias</div></div><span class="arrow">›</span></button>`;
    }

    function mount(index) {
      const cards = reports.map(card).join('');
      stage.className = ['', 'destacado', 'agrupado'][index];
      stage.innerHTML = `<main class="phone"><h1>Tus reportes</h1><p class="intro">Seleccioná un reporte para ver sus coincidencias.</p><div class="list">${cards}</div><nav class="nav"><span>Mapa</span><strong>Coincidencias</strong><span>＋</span><span>Mensajes</span><span>Perfil</span></nav></main>`;
      stage.querySelectorAll('[data-report]').forEach(button => button.onclick = () => {
        const report = reports[Number(button.dataset.report)];
        stage.querySelector('.list').innerHTML = `<section class="detail"><button class="back">‹ Tus reportes</button><h2>Coincidencias de ${report.name}</h2><p>Vista de ejemplo para consultar coincidencias.</p></section>`;
        stage.querySelector('.back').onclick = () => mount(current);
      });
    }

    function setActive(index) {
      current = index;
      items.forEach((item, i) => {
        item.toggleAttribute('data-active', i === index);
        if (i === index) item.setAttribute('aria-current', 'true');
        else item.removeAttribute('aria-current');
      });
      highlight.style.width = items[index].offsetWidth + 'px';
      highlight.style.transform = 'translateX(' + items[index].offsetLeft + 'px)';
      const url = new URL(location);
      url.searchParams.set('v', index + 1);
      history.replaceState(null, '', url);
      mount(index);
    }
    items.forEach((item, i) => item.onclick = () => setActive(i));
    window.addEventListener('resize', () => {
      highlight.style.width = items[current].offsetWidth + 'px';
      highlight.style.transform = 'translateX(' + items[current].offsetLeft + 'px)';
    });
    document.addEventListener('keydown', event => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable || event.metaKey || event.ctrlKey || event.altKey) return;
      const number = Number(event.key);
      if (number >= 1 && number <= 3) setActive(number - 1);
      else if (event.key === 'ArrowRight') setActive((current + 1) % 3);
      else if (event.key === 'ArrowLeft') setActive((current + 2) % 3);
    });
    const requested = Number(new URLSearchParams(location.search).get('v'));
    setActive(requested >= 1 && requested <= 3 ? requested - 1 : 0);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
