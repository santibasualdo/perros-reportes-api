<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huellas a Casa · Mapa</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e7ebe4;color:#183b56;font-family:system-ui,sans-serif}.phone{max-width:440px;height:100dvh;min-height:560px;margin:auto;background:#fafaf7;display:flex;flex-direction:column;overflow:hidden}.header{padding:20px 20px 12px;display:flex;align-items:center;gap:12px}.brand{font-weight:750;font-size:20px}.subtitle{font-size:13px;color:#5a6e7c}.filters{display:flex;gap:8px;padding:8px 16px 14px;overflow-x:auto}.filter{white-space:nowrap;border:0;border-radius:24px;padding:9px 14px;font-weight:650;background:#eef2ec;color:#183b56;cursor:pointer}.filter[aria-pressed=true]{background:#4f2a52;color:white}.map{flex:1;position:relative;overflow:hidden;background:#e9eadf}.map svg.background{width:100%;height:100%;position:absolute;inset:0}.marker{position:absolute;border:3px solid white;color:white;border-radius:50% 50% 50% 8px;transform:translate(-50%,-100%) rotate(-45deg);height:38px;width:38px;box-shadow:0 2px 7px #183b5640;cursor:pointer}.marker span{display:block;transform:rotate(45deg);font-size:17px}.lost{background:#c46f53}.seen{background:#739268}.marker:focus-visible,.filter:focus-visible,.card button:focus-visible{outline:3px solid #4f2a52;outline-offset:3px}.card{position:absolute;left:12px;right:12px;bottom:14px;background:#fff;border-radius:18px;box-shadow:0 5px 20px #183b5622;padding:12px;display:flex;gap:12px;align-items:center}.card[hidden]{display:none}.photo{height:80px;width:80px;flex:none;border-radius:12px;object-fit:cover}.info{flex:1;min-width:0}.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:20px;padding:4px 9px;background:#fde2e0;color:#b42318}.tag.seen-tag{background:#e1f3e4;color:#2e7d32}.name{font:700 22px Georgia,serif;margin:5px 0}.location{font-size:12px;color:#5a6e7c}.card button{background:none;border:0;color:#4f2a52;font-size:26px;cursor:pointer}.nav{display:flex;align-items:center;justify-content:space-around;padding:10px 4px 18px;background:#fafaf7;border-top:1px solid #e4e9e6}.nav button{border:0;background:none;color:#5a6e7c;font:12px system-ui;cursor:pointer}.nav .current{color:#4f2a52;font-weight:700}.nav .plus{background:#4f2a52;color:white;width:48px;height:48px;border-radius:50%;font-size:28px}.notice{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#fff;padding:8px 12px;border-radius:12px;font-size:13px;box-shadow:0 2px 8px #0002}
</style></head><body><main class="phone"><header class="header"><div><div class="brand">Huellas a Casa</div><div class="subtitle">Cerca tuyo</div></div></header><div class="filters" aria-label="Filtrar reportes"><button class="filter" data-filter="todos" aria-pressed="true">Todos</button><button class="filter" data-filter="PERDIDO" aria-pressed="false">Perdidos</button><button class="filter" data-filter="AVISTAMIENTO" aria-pressed="false">Avistamientos</button></div><section class="map" aria-label="Mapa ilustrativo"><svg class="background" viewBox="0 0 440 700" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="440" height="700" fill="#eeeae2"/><path d="M0 70 Q130 120 210 10H0ZM340 370q-80-80 100-140v160ZM0 510q130-110 180 50L0 700Z" fill="#dce7d6"/><g fill="none" stroke="#fff" stroke-width="7"><path d="M-20 150 460 55M-20 260 460 165M-20 370 460 275M-20 480 460 385M-20 590 460 495M-20 700 460 605"/><path d="M30 -20 180 720M130 -20 280 720M230 -20 380 720M330 -20 480 600"/></g><path d="M-20 420Q180 310 460 330" fill="none" stroke="#cbdcdd" stroke-width="19"/><text x="100" y="125" fill="#829287" font-size="15">Córdoba</text></svg><div id="markers"></div><div class="notice" id="notice" hidden></div><article class="card" id="card" hidden><img class="photo" id="photo" src="bienvenida-foto.png" alt=""><div class="info"><span class="tag" id="tag"></span><div class="name" id="name"></div><div class="location" id="location"></div></div><button id="detail" aria-label="Ver detalle del reporte">›</button><button id="close" aria-label="Cerrar tarjeta">×</button></article></section><nav class="nav" aria-label="Navegación de ejemplo"><button class="current" data-tab="Mapa">⌖<br>Mapa</button><button data-tab="Coincidencias">♧<br>Coincidencias</button><button class="plus" data-tab="Crear reporte" aria-label="Crear reporte">+</button><button data-tab="Mensajes">▢<br>Mensajes</button><button data-tab="Perfil">♙<br>Perfil</button></nav></main>
<script>
const reports=[{name:'Luna',type:'AVISTAMIENTO',location:'Nueva Córdoba, Córdoba',x:66,y:30},{name:'Bruno',type:'PERDIDO',location:'Centro, Córdoba',x:35,y:48},{name:'Perro avistado',type:'AVISTAMIENTO',location:'General Paz, Córdoba',x:76,y:65},{name:'Mora',type:'PERDIDO',location:'Alberdi, Córdoba',x:19,y:72}];const markers=document.querySelector('#markers'),card=document.querySelector('#card'),notice=document.querySelector('#notice');let filter='todos',selected=null;function render(){markers.innerHTML='';reports.filter(r=>filter==='todos'||r.type===filter).forEach(r=>{const b=document.createElement('button');b.className='marker '+(r.type==='PERDIDO'?'lost':'seen');b.style.left=r.x+'%';b.style.top=r.y+'%';b.setAttribute('aria-label',r.name+', '+(r.type==='PERDIDO'?'perdido':'avistamiento'));b.innerHTML='<span>●</span>';b.onclick=()=>select(r);markers.appendChild(b)})}function select(r){selected=r;document.querySelector('#name').textContent=r.name;document.querySelector('#location').textContent='⌖  '+r.location;const tag=document.querySelector('#tag');tag.textContent=r.type==='PERDIDO'?'Perdido':'Avistamiento';tag.classList.toggle('seen-tag',r.type!=='PERDIDO');card.hidden=false}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));if(selected&&filter!=='todos'&&filter!==selected.type){card.hidden=true;selected=null}render()});document.querySelector('#close').onclick=()=>{card.hidden=true;selected=null};function alertar(text){notice.textContent=text;notice.hidden=false;clearTimeout(window.noticeTimer);window.noticeTimer=setTimeout(()=>notice.hidden=true,2200)}document.querySelector('#detail').onclick=()=>alertar('Vista de prueba: detalle de '+selected.name);document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>alertar('Vista de prueba: '+b.dataset.tab));render();
</script></body></html>
