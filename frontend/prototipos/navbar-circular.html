<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Huellas a Casa · Navegación</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #e7ebe4; color: #183b56; font-family: system-ui, sans-serif; }
    .phone { position: relative; display: flex; flex-direction: column; max-width: 430px; height: 100dvh; min-height: 560px; margin: auto; overflow: hidden; background: #fafaf7; }
    .header { padding: 88px 20px 16px; }
    h1 { margin: 0; font-size: 24px; }
    .content { position: relative; flex: 1; overflow: hidden; background: #eeece3; }
    .map { width: 100%; height: 100%; }
    .message { padding: 24px; color: #5a6e7c; line-height: 1.5; }
    .nav { display: flex; align-items: center; justify-content: space-around; gap: 2px; padding: 10px 8px 20px; background: #fafaf7; border-top: 1px solid #e2e6df; }
    .nav button { display: flex; flex: 1; min-width: 0; min-height: 52px; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 3px 0; border: 0; background: transparent; color: #5a6e7c; font: 500 10px system-ui; cursor: pointer; }
    .nav button:focus-visible { outline: 2px solid #4f2a52; border-radius: 12px; }
    .nav button:active { transform: scale(.97); }
    .nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.8; }
    .nav .active { color: #4f2a52; font-weight: 700; }
    .nav .icon { display: grid; width: 38px; height: 32px; place-items: center; border-radius: 18px; }
    .clara .active .icon { background: #eee3e9; }
    .clara-elevada .active .icon { background: #eee3e9; }
    .clara-elevada .label { display: none; }
    .clara-elevada .nav .create .icon { transform: translateY(-12px); }
    .nav .create .icon { width: 48px; height: 48px; background: #4f2a52; color: white; border-radius: 50%; }
    .flotante .nav { position: absolute; left: 12px; right: 12px; bottom: 14px; padding: 8px 6px; border: 1px solid #e2e6df; border-radius: 26px; box-shadow: 0 5px 20px #183b5620; }
    .flotante .active .icon { background: #e4ebdf; }
    .compacta .nav { padding: 10px 8px 22px; }
    .compacta .nav button:not(.active):not(.create) .label { display: none; }
    .compacta .active { background: #eee3e9; border-radius: 28px; flex-direction: row; gap: 0; flex: 1.65; padding: 0 8px; }
    .compacta .active .icon { width: 30px; }
    .compacta .create .label { display: none; }
    .proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
    .proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); }
    .proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
    @media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
    .proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out, transform 160ms cubic-bezier(0.23, 1, 0.32, 1); }
    @media (hover: hover) and (pointer: fine) { .proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); } }
    .proto-picker-item:active { transform: scale(0.97); }
    .proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
    .proto-picker-item[data-active] { color: #fff; }
    .proto-picker[data-position="top"] { bottom: auto; top: 24px; }
  
    .circular .label, .borde .label, .integrado .label { display: none; }
    .circular .active .icon, .borde .active .icon, .integrado .active .icon { background: #eee3e9; }
    .circular .nav .create .icon, .borde .nav .create .icon, .integrado .nav .create .icon { transform: translateY(-16px); }
    .circular .nav .create .icon { width: 54px; height: 54px; box-shadow: 0 3px 8px #4f2a5224; }
    .borde .nav .create .icon { width: 56px; height: 56px; color: #4f2a52; background: #f1e8ed; border: 2px solid #4f2a52; }
    .integrado .nav .create .icon { width: 58px; height: 50px; border-radius: 18px; background: #4f2a52; box-shadow: 0 0 0 5px #fafaf7; }
    .circular .nav, .borde .nav, .integrado .nav { padding-top: 10px; }

    /* Tres alturas para el mismo botón circular. */
    .circular .nav .create, .borde .nav .create, .integrado .nav .create { position: relative; z-index: 1; }
    .circular .nav .create { transform: translateY(-7px); }
    .borde .nav .create { transform: translateY(-15px); }
    .integrado .nav .create { transform: translateY(-23px); }
    .circular .nav .create .icon, .borde .nav .create .icon, .integrado .nav .create .icon { transform: none; border: 0; border-radius: 50%; color: white; }
    .circular .nav .create .icon { width: 52px; height: 52px; background: #4f2a52; box-shadow: none; }
    .borde .nav .create .icon { width: 54px; height: 54px; background: #4f2a52; box-shadow: 0 0 0 5px #fafaf7, 0 3px 8px #4f2a5224; }
    .integrado .nav .create .icon { width: 56px; height: 56px; background: #183b56; box-shadow: 0 0 0 5px #fafaf7, 0 4px 10px #183b5626; }
    .circular .nav .create svg { width: 22px; height: 22px; stroke-width: 1.7; }
    .borde .nav .create svg { width: 25px; height: 25px; stroke-width: 2; }
    .integrado .nav .create svg { width: 27px; height: 27px; stroke-width: 2.5; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <nav class="proto-picker" data-position="top" aria-label="Versiones del prototipo">
    <span class="proto-picker-highlight" aria-hidden="true"></span>
    <button class="proto-picker-item">Sutil</button>
    <button class="proto-picker-item">Equilibrado</button>
    <button class="proto-picker-item">Destacado</button>
  </nav>
  <script>
    const sections = [
      { name: 'Mapa', title: 'Cerca tuyo', path: '<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/>' },
      { name: 'Coincidencias', title: 'Tus reportes', path: '<path d="M5 4h14v16H5z"/><path d="M8 9h8M8 13h8M8 17h5"/>' },
      { name: 'Crear', title: 'Crear reporte', path: '<path d="M12 5v14M5 12h14"/>' },
      { name: 'Mensajes', title: 'Mensajes', path: '<path d="M4 5h16v11H9l-5 4V5Z"/>' },
      { name: 'Perfil', title: 'Perfil', path: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6Z"/>' },
    ];
    const map = '<svg class="map" viewBox="0 0 430 600" preserveAspectRatio="xMidYMid slice" aria-label="Mapa ilustrativo"><rect width="430" height="600" fill="#eeece3"/><path d="M0 50Q90 80 180 0H0ZM330 380q-65-70 100-120v140ZM0 510q100-100 170 50L0 600Z" fill="#dce7d6"/><g stroke="#fafaf7" stroke-width="7"><path d="M0 140 430 55M0 245 430 160M0 350 430 265M0 455 430 370M0 560 430 475"/><path d="M30 0 150 600M130 0 250 600M230 0 350 600M330 0 450 600"/></g><circle cx="160" cy="245" r="10" fill="#b85e4d" stroke="white" stroke-width="3"/><circle cx="285" cy="350" r="10" fill="#76946e" stroke="white" stroke-width="3"/></svg>';
    const stage = document.querySelector('#stage');
    const picker = document.querySelector('.proto-picker');
    const highlight = picker.querySelector('.proto-picker-highlight');
    const items = [...picker.querySelectorAll('.proto-picker-item')];
    let current = 0;
    let section = 0;

    function mount(index) {
      const selected = sections[section];
      const buttons = sections.map((item, i) => `<button type="button" data-section="${i}" class="${i === section ? 'active' : ''} ${i === 2 ? 'create' : ''}" aria-label="${item.name}" ${i === section ? 'aria-current="page"' : ''}><span class="icon"><svg viewBox="0 0 24 24" aria-hidden="true">${item.path}</svg></span><span class="label">${item.name}</span></button>`).join('');
      stage.className = ['circular', 'borde', 'integrado'][index];
      stage.innerHTML = `<main class="phone"><header class="header"><h1>${selected.title}</h1></header><section class="content">${section === 0 ? map : '<p class="message">Vista de ejemplo de ' + selected.name.toLowerCase() + '.</p>'}</section><nav class="nav" aria-label="Navegación principal">${buttons}</nav></main>`;
      stage.querySelectorAll('[data-section]').forEach(button => button.addEventListener('click', () => {
        section = Number(button.dataset.section);
        mount(current);
      }));
    }

    function moveHighlight() {
      const el = items[current];
      highlight.style.width = el.offsetWidth + 'px';
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function setActive(index) {
      if (index < 0 || index >= items.length) return;
      current = index;
      items.forEach((item, i) => {
        item.toggleAttribute('data-active', i === index);
        if (i === index) item.setAttribute('aria-current', 'true');
        else item.removeAttribute('aria-current');
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set('v', index + 1);
      history.replaceState(null, '', url);
      mount(index);
    }

    items.forEach((item, i) => item.addEventListener('click', () => setActive(i)));
    window.addEventListener('resize', moveHighlight);
    document.addEventListener('keydown', (event) => {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(event.target.tagName) || event.target.isContentEditable) return;
      if (event.metaKey || event.ctrlKey || event.altKey) return;
      const number = parseInt(event.key, 10);
      if (number >= 1 && number <= items.length) setActive(number - 1);
      else if (event.key === 'ArrowRight') setActive((current + 1) % items.length);
      else if (event.key === 'ArrowLeft') setActive((current - 1 + items.length) % items.length);
    });
    const requested = parseInt(new URLSearchParams(location.search).get('v'), 10);
    setActive(requested >= 1 && requested <= items.length ? requested - 1 : 0);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
  </script>
</body>
</html>
