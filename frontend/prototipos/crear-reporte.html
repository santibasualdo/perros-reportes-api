<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huellas a Casa · Crear reporte</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6e9e4;font:15px system-ui,-apple-system,sans-serif;color:#183b56}button,input,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #4f2a52;outline-offset:2px}.phone{display:flex;flex-direction:column;height:100dvh;max-width:430px;margin:auto;background:#f5f3ed}.status{padding:15px 22px 0;font-size:12px;font-weight:700}.header{padding:15px 20px 0}.brand{display:flex;align-items:center;justify-content:center;gap:7px;font-weight:750}.brand img{width:35px;height:35px;object-fit:contain}.header h1{text-align:center;font-size:23px;margin:15px 0 10px}.progress{display:flex;gap:6px;justify-content:center}.progress span{width:34px;height:6px;border-radius:8px;background:#e1d9ce}.progress .on{background:#b85e4d}.step-label{text-align:center;color:#5a6e7c;font-size:13px;margin:8px 0 0}.body{flex:1;overflow-y:auto;padding:22px 20px 12px}.body h2{font-size:22px;margin:0 0 10px}.subtitle{color:#5a6e7c;line-height:1.45;margin:0 0 18px}.option{display:flex;align-items:center;text-align:left;gap:14px;width:100%;min-height:78px;border:1px solid #ddd3c7;background:#fffaf3;color:#183b56;border-radius:16px;margin-top:12px;padding:12px}.option.lost{background:#f6e3db;border-color:#d29c8b}.option .symbol{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#f3d1c4;color:#8f4034;flex:none}.option.sighting .symbol{background:#dce9d8;color:#42623b}.option .symbol svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.option strong{flex:1}.arrow{font-size:23px;color:#4f2a52}.label{font-weight:700;font-size:14px;display:block;margin:17px 0 7px}.optional{font-weight:400;color:#5a6e7c}.field{width:100%;border:1px solid #d8d0c5;border-radius:12px;background:#fffaf3;color:#183b56;padding:13px}.field::placeholder{color:#889399}textarea.field{resize:vertical;min-height:116px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #d6cfc3;background:#fffaf3;color:#183b56;padding:9px 13px;border-radius:22px;min-height:42px}.chip.active{background:#b85e4d;color:white;border-color:#b85e4d}.map{position:relative;height:260px;overflow:hidden;border:1px solid #e0dacc;border-radius:16px;background:#eeece3;cursor:crosshair}.map svg{width:100%;height:100%}.pin{position:absolute;width:26px;height:26px;border:3px solid white;background:#b85e4d;border-radius:50% 50% 50% 3px;transform:translate(-50%,-85%) rotate(-45deg);box-shadow:0 2px 5px #0003}.pin:after{content:'';position:absolute;background:white;width:6px;height:6px;border-radius:50%;left:7px;top:7px}.map-help{font-size:12px;color:#5a6e7c;margin-top:6px}.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}.photo-add{border:1px dashed #bcb1a2;background:#fffaf3;border-radius:14px;min-height:140px;color:#4f2a52;font-weight:700}.photo-preview{position:relative}.photo-preview img{width:100%;height:140px;object-fit:cover;border-radius:14px;display:block}.remove{position:absolute;right:6px;top:6px;width:32px;height:32px;background:#fffaf3;border:0;border-radius:50%;font-size:20px}.error{color:#a72e24;font-size:13px;margin:12px 0}.buttons{display:flex;gap:10px;padding:14px 20px 20px;background:#f5f3ed}.buttons button{min-height:48px;border-radius:14px;flex:1;font-weight:700}.back{border:1px solid #4f2a52;color:#4f2a52;background:transparent}.next{border:1px solid #4f2a52;color:#fff;background:#4f2a52}.success{text-align:center;padding:40px 10px;line-height:1.6}.success button{border:0;border-radius:14px;background:#4f2a52;color:white;padding:13px 20px}.hidden{display:none}
</style>
</head>
<body>
<main class="phone"><div class="status">9:41</div><header class="header"><div class="brand"><img src="../assets/images/logo-huellas-transparente.png" alt="">Huellas a Casa</div><h1>Crear reporte</h1><div class="progress" aria-hidden="true"></div><p class="step-label"></p></header><div class="body" id="body"></div><div class="buttons" id="buttons"></div></main>
<input id="files" type="file" accept="image/*" multiple class="hidden">
<script>
const body=document.getElementById('body'),buttons=document.getElementById('buttons'),files=document.getElementById('files');let step=1;const data={tipo:'',nombre:'',descripcion:'',ubicacion:null,direccion:'',tamano:'',color:'',raza:'',sexo:'No sé',senas:'',fotos:[]};
const iconDog='<svg viewBox="0 0 24 24"><path d="M5 12V7l3-2 3 2h5l3-2 2 4-2 2v5h-2v3h-2v-3H9v3H7v-3H5v-4Z"/><circle cx="16" cy="10" r=".7"/></svg>',iconEye='<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>';
function input(label,key,placeholder,multi=false,optional=false){return `<label class="label" for="${key}">${label}${optional?' <span class="optional">(opcional)</span>':''}</label>${multi?`<textarea class="field" id="${key}" placeholder="${placeholder}"></textarea>`:`<input class="field" id="${key}" placeholder="${placeholder}">`}`}
function chips(key,values){return `<div class="chips">${values.map(v=>`<button type="button" class="chip ${data[key]===v?'active':''}" data-key="${key}" data-value="${v}" aria-pressed="${data[key]===v}">${v}</button>`).join('')}</div>`}
function showError(msg){let el=document.querySelector('.error');if(!el){el=document.createElement('p');el.className='error';el.setAttribute('role','alert');body.append(el)}el.textContent=msg}
function render(){document.querySelector('.step-label').textContent=`Paso ${step} de 5`;document.querySelector('.progress').innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<step?'on':''}"></span>`).join('');
if(step===1)body.innerHTML=`<h2>¿Qué ocurrió?</h2><p class="subtitle">Elegí la opción que describe tu situación.</p><button class="option lost" data-tipo="Perdido"><span class="symbol">${iconDog}</span><strong>Perdí un perro</strong><span class="arrow">›</span></button><button class="option sighting" data-tipo="Avistamiento"><span class="symbol">${iconEye}</span><strong>Avisté o encontré un perro</strong><span class="arrow">›</span></button>`;
if(step===2)body.innerHTML=`<h2>Datos básicos</h2><p class="subtitle">Contanos un poco sobre el perro.</p>${input('Nombre del perro','nombre','Ej. Simón',false,true)}${input('Descripción','descripcion','Contá dónde lo viste o cómo es.',true)}`;
if(step===3)body.innerHTML=`<h2>Ubicación</h2><p class="subtitle">Tocá el mapa donde se perdió o fue visto.</p><div class="map" role="button" tabindex="0" aria-label="Elegir ubicación en el mapa"><svg viewBox="0 0 380 260" preserveAspectRatio="none" aria-hidden="true"><rect width="380" height="260" fill="#eeece3"/><path d="M0 30 380 170M0 115 380 245M35 0 120 260M150 0 240 260M270 0 365 260" stroke="#fffaf3" stroke-width="12"/><path d="M0 215Q80 165 145 260H0ZM270 0Q260 65 380 50V0" fill="#dce7d6"/></svg>${data.ubicacion?`<span class="pin" style="left:${data.ubicacion.x}%;top:${data.ubicacion.y}%"></span>`:''}</div><div class="map-help">Mapa ilustrativo: hacé clic para marcar una ubicación.</div>${input('Dirección o referencia','direccion','Ej. cerca de la plaza',false,true)}`;
if(step===4)body.innerHTML=`<h2>Características</h2><p class="subtitle">Estos datos ayudan a encontrar coincidencias.</p><span class="label">Tamaño</span>${chips('tamano',['Pequeño','Mediano','Grande'])}<span class="label">Color principal</span>${chips('color',['Negro','Blanco','Marrón','Gris','Beige / dorado','Rojizo','Multicolor'])}${input('Raza','raza','Ej. Mestizo',false,true)}<span class="label">Sexo</span>${chips('sexo',['Macho','Hembra','No sé'])}${input('Señas particulares','senas','Ej. mancha blanca en el pecho',true,true)}`;
if(step===5)body.innerHTML=`<h2>Fotografías</h2><p class="subtitle">Elegí entre 1 y 5 fotos del perro para ayudar a reconocerlo.</p><div class="photos">${data.fotos.map((f,i)=>`<div class="photo-preview"><img src="${f.url}" alt="Foto seleccionada ${i+1}"><button class="remove" data-remove="${i}" aria-label="Quitar foto ${i+1}">×</button></div>`).join('')}${data.fotos.length<5?'<button class="photo-add">＋<br>Agregar fotos</button>':''}</div><p class="map-help">${data.fotos.length} de 5 fotos</p>`;
buttons.innerHTML=`<button class="back">${step===1?'Cancelar':'← Atrás'}</button>${step>1?`<button class="next">${step===5?'Publicar reporte':'Siguiente →'}</button>`:''}`;
['nombre','descripcion','direccion','raza','senas'].forEach(k=>{const el=document.getElementById(k);if(el){el.value=data[k];el.addEventListener('input',()=>data[k]=el.value)}});
body.querySelectorAll('[data-tipo]').forEach(el=>el.addEventListener('click',()=>{data.tipo=el.dataset.tipo;step=2;render()}));body.querySelectorAll('[data-key]').forEach(el=>el.addEventListener('click',()=>{data[el.dataset.key]=el.dataset.value;body.querySelectorAll(`[data-key="${el.dataset.key}"]`).forEach(b=>{const active=b===el;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))})}));
const map=body.querySelector('.map');if(map){const select=(x,y)=>{data.ubicacion={x,y};const old=map.querySelector('.pin');if(old)old.remove();const marker=document.createElement('span');marker.className='pin';marker.style.left=x+'%';marker.style.top=y+'%';map.append(marker)};map.addEventListener('click',e=>{const r=map.getBoundingClientRect();select((e.clientX-r.left)/r.width*100,(e.clientY-r.top)/r.height*100)});map.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(50,50)}})}
body.querySelector('.photo-add')?.addEventListener('click',()=>files.click());body.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{const [removed]=data.fotos.splice(Number(el.dataset.remove),1);URL.revokeObjectURL(removed.url);render()}));
buttons.querySelector('.back').addEventListener('click',()=>{if(step>1){step--;render()}else showError('Este es un prototipo; no se creó ningún reporte.')});buttons.querySelector('.next')?.addEventListener('click',()=>{if(step===2&&!data.descripcion.trim())return showError('Escribí una descripción para continuar.');if(step===3&&!data.ubicacion)return showError('Elegí una ubicación en el mapa.');if(step===4&&(!data.tamano||!data.color))return showError('Elegí el tamaño y el color principal.');if(step===5&&!data.fotos.length)return showError('Agregá al menos una fotografía.');if(step===5){body.innerHTML='<div class="success"><h2>¡Reporte listo!</h2><p>Este es un prototipo: no se publicó ningún reporte.</p><button id="restart">Volver al inicio</button></div>';buttons.innerHTML='';body.querySelector('#restart').addEventListener('click',()=>{data.fotos.forEach(f=>URL.revokeObjectURL(f.url));Object.assign(data,{tipo:'',nombre:'',descripcion:'',ubicacion:null,direccion:'',tamano:'',color:'',raza:'',sexo:'No sé',senas:'',fotos:[]});step=1;render()});return}step++;render();body.scrollTop=0});
}
files.addEventListener('change',()=>{const remaining=5-data.fotos.length;Array.from(files.files).slice(0,remaining).forEach(f=>data.fotos.push({url:URL.createObjectURL(f)}));files.value='';render()});render();
</script>
</body>
</html>
