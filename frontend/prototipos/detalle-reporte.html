<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Huellas a Casa · Detalle del reporte</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9ebe5;font:15px system-ui,sans-serif;color:#183b56}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #4f2a52;outline-offset:2px}.phone{max-width:430px;height:100dvh;min-height:560px;margin:auto;background:#f5f3ed;overflow:auto}.status{padding:20px 22px 0;font-size:12px;font-weight:700}.header{display:flex;gap:12px;align-items:center;padding:12px 18px}.back{width:44px;height:44px;border:1px solid #e9e2d6;background:#fffaf3;border-radius:50%;font-size:25px;color:#183b56}.header h1{font-size:20px;margin:0}.content{padding:0 18px 38px}.photo-button{display:block;border:0;padding:0;width:100%;background:#eae7dd;border-radius:20px;overflow:hidden;position:relative}.photo{display:block;width:100%;height:250px;object-fit:contain}.photo-hint{position:absolute;right:12px;bottom:12px;background:#fffaf3eF;border-radius:20px;padding:7px 11px;font-size:12px;color:#183b56}.identity{padding:18px 1px}.tag{display:inline-block;background:#f6e3db;color:#8f4034;font-weight:700;font-size:12px;border-radius:30px;padding:5px 10px}.identity h2{font-size:26px;margin:8px 0 5px}.meta{color:#607580;font-size:13px;line-height:1.8}.section{background:#fffaf3;border:1px solid #e9e2d6;border-radius:18px;padding:17px;margin-bottom:12px}.section h3,.plain h3{font-size:16px;margin:0 0 12px}.section p,.plain p{line-height:1.5;margin:0;color:#546c7a}.facts{display:grid;grid-template-columns:1fr 1fr;gap:12px}.fact{font-size:14px}.fact small{display:block;color:#70808a;font-size:12px;margin-bottom:3px}.action{display:flex;gap:10px}.action button{min-height:46px;flex:1;border-radius:13px;font-weight:700}.reject{background:transparent;border:1px solid #b85e4d;color:#9f4c3d}.confirm,.chat{border:0;background:#4f2a52;color:white}.hint{color:#687d85;font-size:13px;line-height:1.5;margin:0 0 14px}.section .map-link{margin-top:10px;padding:4px 0;border:0;background:none;color:#4f2a52;font-weight:700}.compact .photo-button{width:124px;flex:none}.compact .photo{height:148px}.compact .hero{display:flex;gap:14px;align-items:center}.compact .identity{flex:1}.compact .identity h2{font-size:23px}.compact .photo-hint{font-size:0;padding:8px}.compact .photo-hint:after{content:'＋';font-size:15px}.compact .content{padding-top:10px}.sections .photo{height:205px}.sections .identity{padding:16px}.sections .hero{background:#fffaf3;border-radius:20px;overflow:hidden;border:1px solid #e9e2d6;margin-bottom:12px}.sections .photo-button{border-radius:0}.sections .section{border:0;background:transparent;border-bottom:1px solid #e6e0d7;border-radius:0;margin:0;padding:18px 2px}.sections .section.decision{background:#fffaf3;border:1px solid #e9e2d6;border-radius:18px;padding:16px;margin-top:18px}.empty-message{font-size:13px;color:#5a6e7c}.overlay{position:fixed;inset:0;background:#17212cdd;display:grid;place-items:center;padding:22px;z-index:20}.overlay[hidden]{display:none}.photo-full{max-width:min(100%,650px);max-height:80vh;object-fit:contain}.close{position:absolute;right:24px;top:24px;border:0;border-radius:50%;width:44px;height:44px;background:white;font-size:25px}.modal-box{background:#fffaf3;border-radius:18px;padding:22px;max-width:340px}.modal-box button{border:0;border-radius:12px;background:#4f2a52;color:#fff;padding:12px 18px}.photo-overlay[hidden],.notice-overlay[hidden]{display:none}
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12)}.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}@media(prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out,transform 160ms cubic-bezier(.23,1,.32,1)}@media(hover:hover) and (pointer:fine){.proto-picker-item:hover{color:rgba(255,255,255,.85)}}.proto-picker-item:active{transform:scale(.97)}.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}.proto-picker-item[data-active]{color:#fff}.proto-picker[data-position="top"]{bottom:auto;top:24px}
</style>
</head>
<body>
<div id="stage"></div>
<nav class="proto-picker" data-position="top" aria-label="Versiones del prototipo"><span class="proto-picker-highlight" aria-hidden="true"></span><button class="proto-picker-item" data-active aria-current="true">Foto</button><button class="proto-picker-item">Compacto</button><button class="proto-picker-item">Secciones</button></nav>
<div class="overlay photo-overlay" hidden><button class="close" aria-label="Cerrar fotografía">×</button><img class="photo-full" src="bienvenida-foto.png" alt="Fotografía ampliada del perro"></div>
<div class="overlay notice-overlay" hidden><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="notice-title"><h2 id="notice-title">Vista de ejemplo</h2><p id="notice-text"></p><button id="notice-close">Entendido</button></div></div>
<script>
const stage=document.getElementById('stage'),picker=document.querySelector('.proto-picker'),highlight=picker.querySelector('.proto-picker-highlight'),items=[...picker.querySelectorAll('.proto-picker-item')],photoOverlay=document.querySelector('.photo-overlay'),notice=document.querySelector('.notice-overlay');let current=0,estado='PENDIENTE',previousFocus=null;
function showNotice(text){previousFocus=document.activeElement;document.getElementById('notice-text').textContent=text;notice.hidden=false;document.getElementById('notice-close').focus()}
function mount(i){const mode=['foto','compact','sections'][i];stage.innerHTML=`<main class="phone ${mode}"><div class="status">9:41</div><header class="header"><button class="back" aria-label="Volver">‹</button><h1>Detalle del reporte</h1></header><div class="content"><div class="hero"><button class="photo-button" aria-label="Ampliar fotografía"><img class="photo" src="bienvenida-foto.png" alt="Perro del reporte"><span class="photo-hint">Ampliar foto</span></button><div class="identity"><span class="tag">Perdido</span><h2>Simón</h2><div class="meta">⌖ &nbsp;Barrio Centro, Corrientes<br>◷ &nbsp;15 de noviembre de 2026<br>● &nbsp;Reporte activo</div></div></div><section class="section"><h3>Descripción</h3><p>Simón se perdió cerca de la plaza. Es tranquilo y suele acercarse cuando lo llaman.</p></section><section class="section"><h3>Características</h3><div class="facts"><div class="fact"><small>Tamaño</small>Mediano</div><div class="fact"><small>Color</small>Marrón y blanco</div><div class="fact"><small>Sexo</small>Macho</div><div class="fact"><small>Raza</small>Mestizo</div></div><p style="margin-top:14px"><small>Señas particulares</small><br>Mancha blanca en el pecho.</p></section><section class="section"><h3>Ubicación</h3><p>Barrio Centro, Corrientes</p><button class="map-link">Ver en el mapa →</button></section><section class="section decision"><h3>Coincidencia</h3><p class="hint">${estado==='PENDIENTE'?'Revisá los datos antes de tomar una decisión.':estado==='CONFIRMADA'?'Confirmaste esta coincidencia.':'Descartaste esta coincidencia.'}</p>${estado==='PENDIENTE'?'<div class="action"><button class="reject">Rechazar</button><button class="confirm">Confirmar</button></div>':estado==='CONFIRMADA'?'<div class="action"><button class="chat">Abrir chat</button></div>':'<p class="empty-message">Estado: descartada</p>'}</section></div></main>`;stage.querySelector('.photo-button').addEventListener('click',()=>{previousFocus=document.activeElement;photoOverlay.hidden=false;photoOverlay.querySelector('button').focus()});stage.querySelector('.back').addEventListener('click',()=>showNotice('Volverías a la pantalla anterior.'));stage.querySelector('.map-link').addEventListener('click',()=>showNotice('Se abriría el mapa con la ubicación del reporte.'));stage.querySelector('.confirm')?.addEventListener('click',()=>{estado='CONFIRMADA';mount(current)});stage.querySelector('.reject')?.addEventListener('click',()=>{estado='DESCARTADA';mount(current)});stage.querySelector('.chat')?.addEventListener('click',()=>showNotice('Se abriría la conversación de esta coincidencia.'))}
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function setActive(i){if(i<0||i>=items.length)return;current=i;estado='PENDIENTE';items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i)}
function closeOverlay(el){el.hidden=true;previousFocus?.focus()}photoOverlay.querySelector('button').addEventListener('click',()=>closeOverlay(photoOverlay));document.getElementById('notice-close').addEventListener('click',()=>closeOverlay(notice));items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));window.addEventListener('resize',moveHighlight);document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!photoOverlay.hidden)closeOverlay(photoOverlay);else if(!notice.hidden)closeOverlay(notice);return}if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(n>=1&&n<=items.length)setActive(n-1);else if(e.key==='ArrowRight')setActive((current+1)%items.length);else if(e.key==='ArrowLeft')setActive((current-1+items.length)%items.length)});const requested=parseInt(new URLSearchParams(location.search).get('v'),10);setActive(requested>=1&&requested<=items.length?requested-1:0);requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
</html>
